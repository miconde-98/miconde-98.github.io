- name: editorial
  label: Publications et réalisations
  type: group
  items:
  - name: posts
    label: Articles du blog
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields:
      - title
      - language
      - category
      - date
      - published
      primary: title
      sort:
      - date
      - title
      default:
        sort: date
        order: desc
    fields:
    - name: title
      label: Titre / Title
      type: string
      required: true
    - name: description
      label: Résumé court / Excerpt
      type: text
      required: true
    - name: date
      label: Date
      type: date
      required: true
      options:
        format: yyyy-MM-dd
    - name: language
      label: Langue
      type: select
      required: true
      options:
        values:
        - name: fr
          label: Français
        - name: en
          label: English
        - name: tr
          label: Türkçe
    - name: category
